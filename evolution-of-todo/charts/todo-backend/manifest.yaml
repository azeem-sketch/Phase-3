apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app.kubernetes.io/name: todo-backend
    app.kubernetes.io/instance: todo-app
spec:
  replicas: 2 # Parameterized (Task C3)
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-backend
      app.kubernetes.io/instance: todo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-backend
        app.kubernetes.io/instance: todo-app
    spec:
      containers:
        - name: todo-backend
          image: "todo-backend:latest"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "development"
            - name: DATABASE_URL
              value: "sqlite:///./todo.db"
            - name: CORS_ORIGINS
              value: "http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:54858"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: todo-backend
    app.kubernetes.io/instance: todo-app
